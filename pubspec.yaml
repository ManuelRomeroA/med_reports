name: med_reports
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7
  flutter: ">=3.41.4"

dependencies:
  flutter:
    sdk: flutter

  layrz_theme: ^7.5.17
  layrz_icons: ^1.0.5
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  pdf: ^3.11.3
  printing: ^5.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.6
  freezed: ^3.1.0
  json_serializable: ^6.7.0
  # json_annotation is required at runtime for codegen; the package is
  # declared in `dependencies` to satisfy build_runner/json_serializable.

flutter:
  uses-material-design: true
